name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run release
        env:
          RELEASE_SHA: ${{ github.sha }}
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: mefoot-${{ github.sha }}
          path: build/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  staging:
    name: staging
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CF_ACCOUNT_ID != '' && vars.STAGING_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: mefoot-${{ github.sha }}
          path: build/
      - name: Configure API connection when enabled
        shell: bash
        run: |
          if [ -n "$API_ORIGIN" ]; then
            if [ -z "$API_EDGE_SHARED_KEY" ]; then
              echo 'API_ORIGIN requires the API_EDGE_SHARED_KEY Actions secret.' >&2
              exit 1
            fi
            printf '%s' "$API_EDGE_SHARED_KEY" | npx wrangler secret put EDGE_SHARED_KEY --env staging
          fi
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          API_EDGE_SHARED_KEY: ${{ secrets.API_EDGE_SHARED_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - run: npm run deploy:staging
        env:
          RELEASE_SHA: ${{ github.sha }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          STAGING_URL: ${{ vars.STAGING_URL }}
