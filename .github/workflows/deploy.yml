name: Deploy production
run-name: Deploy production ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA that passed staging
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Find a successful staging release
        id: source
        uses: actions/github-script@v9
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              throw new Error('Run this workflow from main.');
            }
            const sha = process.env.SOURCE_SHA.toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              throw new Error('source_sha must be a full 40-character commit SHA.');
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'push',
              head_sha: sha,
              status: 'success',
              per_page: 100,
            });
            for (const run of runs) {
              if (run.head_sha !== sha || run.head_branch !== 'main' ||
                  run.event !== 'push' || run.conclusion !== 'success') continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo, run_id: run.id, filter: 'latest', per_page: 100,
              });
              if (!jobs.some(job => job.name === 'staging' && job.conclusion === 'success')) continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: run.id, per_page: 100,
              });
              const matches = artifacts.filter(artifact =>
                artifact.name === `mefoot-${sha}` && !artifact.expired);
              if (matches.length !== 1) continue;
              core.setOutput('sha', sha);
              core.setOutput('run_id', String(run.id));
              core.setOutput('artifact_id', String(matches[0].id));
              core.info(`Promoting ${sha} from CI run ${run.id}.`);
              return;
            }
            throw new Error('No successful main CI run with successful staging and an available release artifact matches this SHA.');
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: build/
      - run: npm run deploy:production
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
